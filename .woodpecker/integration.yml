# Routes this workflow to the in-cluster Kubernetes agent, which advertises
# `!runner=k8s` — a MANDATORY label, so an agent is only eligible when a task
# asks for it. Deleting this line sends the workflow back to the ci-ops Docker
# agent; that is the rollback, and it is one line.
#
# This repo builds no container image, so there is nothing else to convert: no
# buildx plugin, no registry push, no extra_hosts, no repo trust needed.
labels:
  runner: k8s

when:
  - event: push
    branch: main
  - event: pull_request

steps:
  build-sidecar:
    image: rust:1
    # Resources declared 29-07-2026 — without them the step pod is QoS BestEffort, first
    # evicted under node memory pressure. Estate-wide sweep after two pulse-backend steps
    # were SIGKILLed (exit 137) mid-download, presenting as a test failure (see
    # pulse-backend #147/#148). Sized by step class.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 2Gi, cpu: 1 }
          limits: { memory: 6Gi }
    commands:
      - D=$(dirname $(pwd))
      - git clone --depth 1 https://github.com/ciphera-net/tessera.git "$D/tessera-rust"
      - cd "$D/tessera-rust"
      - cargo build --release --bin tessera-sidecar
      - cargo build --release --example client_helper

  integration:
    image: golang:1.25
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 1Gi, cpu: 500m }
          limits: { memory: 3Gi }
    commands:
      - D=$(dirname $(pwd))
      - export TESSERA_SIDECAR_BIN="$D/tessera-rust/target/release/tessera-sidecar"
      - export TESSERA_CLIENT_HELPER_BIN="$D/tessera-rust/target/release/examples/client_helper"
      # NOTE: `-v` is intentionally omitted — examples/client_helper prints export_key on stdout
      # (see its WARNING); `-v` would forward that ephemeral test value into the CI logs.
      - go test -tags integration -race ./...
